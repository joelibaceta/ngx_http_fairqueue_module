worker_processes 1;  # 1 worker en la demo para que el shared dict sea fácil de razonar.
error_log /dev/stderr info;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
    lua_package_path "/etc/nginx/lua/?.lua;;";

    # Estado compartido entre workers. En el módulo C real esto es
    # `fairqueue_zone ... zone=...:32m`.
    lua_shared_dict fq 32m;

    # Carga/valida el módulo al arrancar (falla rápido si hay error de sintaxis).
    init_by_lua_block {
        require "config"
        require "fairqueue"
    }

    # Backend de negocio simulado (el módulo NO necesita conocerlo).
    upstream existing_backend {
        server backend:9000;
    }

    server {
        listen 8080;
        default_type text/html;

        # ----- Ruta protegida: MODO SIMPLE -----
        # Todo por defecto (config.lua + env). En el módulo C equivale a:
        #   location /checkout {
        #       fairqueue on;
        #       proxy_pass http://existing_backend;
        #   }
        location /checkout {
            access_by_lua_block {
                require("fairqueue").gate()   -- sin opts => defaults
            }
            proxy_pass http://existing_backend;
            proxy_set_header Host $host;
            # Nunca reenviar X-FairQueue-* que venga del CLIENTE (spoofing):
            # el backend no debe confiar en ellos. Se limpian explícitamente.
            proxy_set_header X-FairQueue-Position "";
            proxy_set_header X-FairQueue-State "";
            proxy_set_header X-FairQueue-ETA "";
            proxy_set_header X-FairQueue-Total "";
        }

        # ----- Ruta protegida: MODO EXPERTO -----
        # La tabla de opts es el análogo en el prototipo de las directivas del
        # módulo C. Todo lo no seteado hereda el default. En el módulo C:
        #   location /drop {
        #       fairqueue        on;
        #       fairqueue_waiting_start 2026-10-03T09:30:00-05:00;  # abre registro
        #       fairqueue_start         2026-10-03T10:00:00-05:00;  # arranca cursor
        #       fairqueue_rate   1000r/m;
        #       fairqueue_penalty 0.03;          # fracción de N
        #       fairqueue_aging  0.2;
        #       fairqueue_window_headroom 0.2;   # colchón (ventana sobredimensionada)
        #       fairqueue_allocation hash;       # hash (default) | fifo (baseline)
        #       fairqueue_scope drop;            # liga el token a esta cola
        #       fairqueue_waiting_uri /waiting-room;
        #       proxy_pass http://existing_backend;
        #   }
        location /drop {
            access_by_lua_block {
                require("fairqueue").gate({
                    rate_per_sec     = 1000/60,
                    penalty_fraction = 0.03,
                    aging_per_sec    = 0.2,
                    window_headroom  = 0.2,
                    allocation       = "hash",   -- "fifo" solo para comparar baseline
                    scope            = "drop",   -- token NO sirve en /checkout
                    waiting_uri      = "/waiting-room",
                    -- Detección ENCHUFABLE: el integrador trae su score de riesgo.
                    -- (a) vía header de un upstream de confianza:
                    --        risk_header = "X-Risk-Score",
                    -- (b) o un hook Lua propio (reputación ASN, fraude, fingerprint):
                    risk_fn = function()
                        -- devuelve 0..1; aquí un ejemplo trivial de demo
                        return tonumber(ngx.var.http_x_demo_risk) or 0
                    end,
                    risk_weight = 0.5,            -- score 1.0 => +0.5*N posiciones
                })
            }
            proxy_pass http://existing_backend;
            proxy_set_header Host $host;
            proxy_set_header X-FairQueue-Position "";
            proxy_set_header X-FairQueue-State "";
            proxy_set_header X-FairQueue-ETA "";
            proxy_set_header X-FairQueue-Total "";
        }

        # ----- Sala de espera (estática) -----
        location = /waiting-room {
            root /etc/nginx/html;
            try_files /waiting-room.html =404;
        }

        # ----- Endpoint de estado (JSON) -----
        # La página de espera hace polling aquí. La admisión se decide server-side.
        location = /__fairqueue/status {
            content_by_lua_block {
                require("fairqueue").status()
            }
        }

        # Página de inicio: enlace a /checkout.
        location = / {
            return 200 '<!doctype html><meta charset=utf-8><body style="font-family:system-ui;display:grid;place-items:center;height:100vh;margin:0;background:#0b1120;color:#e2e8f0"><div style="text-align:center"><h1>FairQueue demo</h1><a href="/checkout" style="color:#60a5fa">Ir a /checkout &rarr;</a></div>';
        }
    }
}
