worker_processes 1;
error_log /dev/stderr info;
pid /tmp/nginx.pid;
events { worker_connections 1024; }

http {
    server {
        listen 9000;
        default_type text/html;

        # Backend de negocio simulado. Responde a quien ya fue admitido por FairQueue.
        location / {
            return 200 '<!doctype html><meta charset=utf-8><body style="font-family:system-ui;display:grid;place-items:center;height:100vh;margin:0;background:#052e16;color:#dcfce7"><div style="text-align:center"><h1>&#127915; Acceso concedido</h1><p>Backend real: estás en el checkout.</p><p style="color:#86efac">Posición admitida: $http_x_fairqueue_position</p></div>';
        }
    }
}
